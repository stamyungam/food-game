<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อาหารที่มีประโยชน์ และ อาหารที่ไม่มีประโยชน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3426;--cream:#fff3d6;--good:#9be37f;--bad:#ffb870;--yellow:#ffd34d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
:root{--u:min(1vw,.68dvh,7.4px)}
body{font-family:"Mali","Sarabun","Noto Sans Thai","Thonburi",system-ui,sans-serif;font-weight:700;color:var(--ink);
  background-color:var(--cream);background-image:radial-gradient(#f1dba6 2.5px,transparent 3px);background-size:28px 28px;touch-action:manipulation}
svg .o{stroke:#4a3426;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
#game{height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));width:calc(100*var(--u));max-width:100%;margin:0 auto}
.title{display:inline-block;background:var(--yellow);border:4px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:4px 16px;font-size:clamp(1.05rem,calc(4.2*var(--u)),1.8rem);line-height:1.25;margin:2px 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:2px 16px;font-size:clamp(1.1rem,calc(4*var(--u)),1.6rem)}
.sound{border:3px solid var(--ink);background:#fff;border-radius:50%;width:64px;height:64px;font-size:1.9rem;flex:none;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0}
.sound:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
#card{--s:min(calc(40*var(--u)),calc(100dvh - 560px),270px);width:var(--s);height:var(--s);min-width:130px;min-height:130px;background:#fff;border:5px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;position:relative;z-index:5;overflow:hidden;animation:wobble 3s ease-in-out infinite}
#card svg{width:84%;height:84%;pointer-events:none}
#card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#card.drag{cursor:grabbing;z-index:50;box-shadow:0 20px 0 rgba(74,52,38,.25);animation:none}
#card.back{transition:transform .25s}
#card.shake{animation:shake .45s}
#card.hide{opacity:0;transform:scale(.3);transition:all .35s;animation:none}
#info{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px 12px 14px 20px;margin-top:26px;width:min(100%,560px);text-align:left;transition:background .2s}
#info.warn{background:#fff0e0;border-color:#e8590c}
#infoText{flex:1;min-width:0}
#name{font-size:clamp(1.9rem,calc(7*var(--u)),2.9rem);line-height:1.35;margin-bottom:14px;min-height:1.35em;text-align:center}
#cue{font-size:clamp(1rem,calc(3.9*var(--u)),1.4rem);line-height:1.4;opacity:.8;min-height:2.8em;display:flex;align-items:center}
#info.warn #cue,#info.ok #cue{opacity:1}
#info.ok{background:#e9f9e1;border-color:#3a9a2a}
.sound.speaking{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#drop{display:flex;gap:22px;flex:none;margin-top:22px;height:min(36vh,330px);padding-bottom:0}
.box{flex:1;border:5px solid var(--ink);border-radius:30px;display:flex;flex-direction:column;align-items:center;padding:12px 10px 14px;cursor:pointer;min-width:0;box-shadow:0 8px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.box:active{transform:translateY(7px);box-shadow:0 1px 0 var(--ink)}
.box.over{box-shadow:0 0 0 7px #fff,0 8px 0 7px var(--ink);transform:scale(1.03)}
#good{background:var(--good)}
#bad{background:var(--bad)}
.box>svg{height:44%;flex:none}
.label{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:3px 10px;font-size:clamp(.9rem,calc(3.4*var(--u)),1.6rem);line-height:1.2;margin:2px 0 6px;text-align:center}
.items{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;justify-items:center;align-content:start;overflow:hidden;padding:0 2px}
.chip{width:100%;max-width:48px;aspect-ratio:1/1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:pop .4s}
.chip svg{width:86%;height:86%}
.chip img{width:100%;height:100%;object-fit:cover}
.overlay{position:fixed;inset:0;background-color:var(--cream);background-image:radial-gradient(#f1dba6 2.5px,transparent 3px);background-size:28px 28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:20px;z-index:100;overflow:auto}
.overlay{padding-left:max(20px,calc((100vw - 100*var(--u))/2 + 20px));padding-right:max(20px,calc((100vw - 100*var(--u))/2 + 20px))}
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay h2{font-size:clamp(1.9rem,calc(7*var(--u)),3.2rem);margin:8px 0}
.overlay p{font-size:clamp(1.15rem,calc(4.4*var(--u)),1.8rem);margin:6px 0}
.big{padding:16px 46px;font-size:clamp(1.5rem,calc(6*var(--u)),2.4rem);font-weight:700;color:var(--ink);background:var(--good);border:5px solid var(--ink);border-radius:999px;box-shadow:0 8px 0 var(--ink);cursor:pointer;font-family:inherit;margin-top:20px}
.big:active{transform:translateY(7px);box-shadow:0 1px 0 var(--ink)}
.stars{font-size:clamp(2.2rem,calc(9*var(--u)),3.6rem);letter-spacing:4px}
#end .stars{margin-top:16px}
.hidden{display:none!important}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;width:100%;max-width:900px;margin-top:10px}
.gcell{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:8px 6px;font-size:1.05rem}
.gcell.g{background:#dff7d3}.gcell.b{background:#ffe6cc}
.gcell svg,.gcell img{width:100%;aspect-ratio:1;object-fit:cover}
.sec{font-size:1.4rem;margin:14px 0 0;width:100%;max-width:900px;text-align:left}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.logoSvg{width:min(calc(78*var(--u)),340px);height:auto;max-height:28vh}
.logo.small .logoSvg{width:min(calc(60*var(--u)),240px);max-height:18vh}
.logoTitle{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.pillG,.pillB{border:4px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:2px 18px;font-size:clamp(1.25rem,calc(5.2*var(--u)),2rem);line-height:1.35}
.pillG{background:var(--good)}.pillB{background:var(--bad)}
.logoTitle .divider{align-self:stretch;display:flex;align-items:center;gap:10px;margin:7px 0}
.logoTitle .divider span{flex:1;height:4px;background:var(--ink);border-radius:2px}
.logoTitle .divider b{font-size:clamp(1.1rem,calc(4.4*var(--u)),1.5rem);line-height:1.2;font-weight:700}
.logo.small .pillG,.logo.small .pillB{font-size:clamp(1.05rem,calc(4.2*var(--u)),1.5rem);padding:3px 14px}
.logo.small .logoTitle .divider{margin:4px 0;gap:8px}
.logo.small .logoTitle .divider span{height:3px}
.logo.small .logoTitle .divider b{font-size:1rem}
.eyebrow{background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:2px 18px;font-size:clamp(.95rem,calc(3.6*var(--u)),1.2rem);margin-bottom:8px}
#start .logoSvg{max-height:24vh}
#start .pillG,#start .pillB{font-size:clamp(1.55rem,calc(6.9*var(--u)),2.8rem);padding:4px 16px;line-height:1.3;white-space:nowrap}
.overlay p.how{font-size:clamp(1.05rem,calc(4*var(--u)),1.35rem);font-weight:500;margin:14px 0 0;max-width:30em}
.overlay p.how2{font-size:clamp(.9rem,calc(3.4*var(--u)),1.1rem);font-weight:500;opacity:.65;margin:2px 0 0}
#start .big{font-size:clamp(1.8rem,calc(7*var(--u)),2.7rem);padding:16px 54px;margin-top:18px}
@media (max-height:520px){#start .logoSvg{max-height:26vh}#start .pillG,#start .pillB{font-size:1.4rem}.overlay p.how{margin-top:8px}#start .big{padding:10px 40px;margin-top:10px;font-size:1.6rem}}
@media (orientation:landscape) and (max-height:520px){
  #start{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);align-content:center;justify-items:center;column-gap:24px;padding:10px}
  #start>:first-child,#start>:last-child{margin:0}
  #start .logo{grid-column:1;grid-row:1 / 5;align-self:center}
  #start .eyebrow{grid-column:2;grid-row:1;align-self:end;margin:0 0 6px}
  #start p.how{grid-column:2;grid-row:2;margin:6px 0 0}
  #start p.how2{grid-column:2;grid-row:3}
  #start .big{grid-column:2;grid-row:4;align-self:start;margin:12px 0 0}
}
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;text-align:center;flex:none;margin-bottom:6px}
header .pill{font-size:clamp(.95rem,calc(3.8*var(--u)),1.35rem);padding:2px 12px}
.gameTitle{justify-self:center}
.gameTitle .pillG,.gameTitle .pillB{font-size:clamp(.8rem,calc(3.9*var(--u)),1.3rem);padding:1px 10px;border-width:3px;box-shadow:0 3px 0 var(--ink);line-height:1.35;white-space:nowrap}
.gameTitle .divider{margin:3px 0;gap:6px}
.gameTitle .divider span{height:3px}
.gameTitle .divider b{font-size:clamp(.8rem,calc(3.3*var(--u)),1.1rem)}
@media (orientation:landscape) and (max-height:500px){.gameTitle{flex-direction:row;gap:8px}.gameTitle .divider{align-self:auto;margin:0}.gameTitle .divider span{display:none}}
#cardWrap{display:flex;align-items:center;justify-content:center}
#game{position:relative;padding-left:18px;padding-right:18px;padding-bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px))}
#nextBtn{position:absolute;right:18px;bottom:max(14px,env(safe-area-inset-bottom));z-index:8;white-space:nowrap;padding:6px 18px;font-family:inherit;font-weight:700;font-size:1.2rem;color:var(--ink);background:var(--yellow);border:4px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
#nextBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
@media (min-width:700px){#nextBtn{font-size:1.5rem;padding:8px 24px}#game{padding-bottom:96px}}
@keyframes wobble{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (max-height:700px) and (min-height:501px),(orientation:landscape) and (min-height:501px) and (max-height:830px){
  #game{padding-bottom:64px}
  #nextBtn{font-size:1.2rem;padding:6px 18px}
  #drop{height:31dvh;margin-top:10px}
  .title{font-size:1rem;margin-bottom:6px}
  .pill{font-size:1.05rem}
  #name{font-size:1.7rem;margin-bottom:2px}
  #info{margin-top:14px;padding:6px 8px 8px 14px}
  .sound{width:52px;height:52px;font-size:1.5rem}
  #cue{font-size:.95rem}
  #card{--s:min(calc(38*var(--u)),calc(56dvh - 245px));min-width:104px;min-height:104px}
  #info{margin-top:8px}
  #name{margin-bottom:6px}
  .box>svg{height:36%}
  .label{line-height:1.12;padding:2px 8px;margin:0 0 4px}
  #drop{height:34dvh}
}
@media (max-height:620px) and (min-height:501px){
  #drop{height:31dvh}
  .box>svg{height:32%}
}
@media (orientation:landscape) and (max-height:500px){
  :root{--u:min(1vw,7.4px)}
  #game{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);column-gap:16px;width:100%;max-width:1100px}
  header{grid-column:1 / 3}
  #stage{grid-column:1;grid-row:2}
  #drop{grid-column:2;grid-row:2;height:auto;min-height:0;margin-top:0}
  #card{--s:min(calc(30*var(--u)),calc(100dvh - 315px),300px)}
}
@media (orientation:landscape) and (max-height:500px){
  .title{display:none}
  header{margin-bottom:4px}
  .box>svg{height:30%}
  .label{font-size:.95rem;line-height:1.1;margin:0 0 3px}
  .items{gap:3px}
  #game{padding-bottom:58px}
  #nextBtn{font-size:1.05rem;padding:4px 14px;bottom:10px}
  #name{font-size:1.6rem;margin-bottom:0}
  #info{margin-top:10px;padding:4px 6px 6px 12px}
  .sound{width:50px;height:50px;font-size:1.4rem}
  #cue{font-size:.95rem;min-height:2.4em}
  #card{--s:min(calc(24*var(--u)),calc(100dvh - 215px))}
}
</style>
</head>
<body>
<div id="game">
  <header>
    <span class="pill" id="num">1/20</span>
    <div class="logoTitle gameTitle" id="gameTitle"></div>
    <span class="pill" id="score">⭐ 0</span>
  </header>
  <div id="stage">
    <div id="name"></div>
    <div id="cardWrap">
      <div id="card"></div>
      <button id="nextBtn" class="hidden">ถัดไป ➡</button>
    </div>
    <div id="info">
      <div id="infoText"><div id="cue"></div></div>
      <button class="sound" id="say" aria-label="ฟังเสียง">🔊</button>
    </div>
  </div>
  <div id="drop">
    <div class="box" id="good" data-kind="good" role="button" aria-label="อาหารที่มีประโยชน์">
      <svg viewBox="-6 0 134 140" aria-hidden="true">
        <circle class="o" cx="20" cy="42" r="11" fill="#8a4b2a"/><circle class="o" cx="100" cy="42" r="11" fill="#8a4b2a"/>
        <path d="M38 98 Q22 112 30 128" fill="none" stroke="#4a3426" stroke-width="17" stroke-linecap="round"/>
        <path d="M38 98 Q22 112 30 128" fill="none" stroke="#ffdcb8" stroke-width="11" stroke-linecap="round"/>
        <path class="o" d="M26 140 L36 92 Q60 82 84 92 L94 140Z" fill="#ff7aa8"/>
        <path d="M80 98 Q92 102 98 104" fill="none" stroke="#4a3426" stroke-width="17" stroke-linecap="round"/>
        <path d="M80 98 Q92 102 98 104" fill="none" stroke="#ffdcb8" stroke-width="11" stroke-linecap="round"/>
        <g transform="translate(108 82) rotate(-6)">
          <rect class="o" x="-11" y="-19" width="12" height="32" rx="6" fill="#ffdcb8"/>
          <rect class="o" x="-14" y="0" width="30" height="28" rx="9" fill="#ffdcb8"/>
          <rect x="-9.5" y="-17.5" width="9" height="29" rx="4.5" fill="#ffdcb8"/>
          <rect x="-12.5" y="1.5" width="27" height="25" rx="7.5" fill="#ffdcb8"/>
          <path d="M3 9 H14 M3 15.5 H14 M3 22 H12" stroke="#4a3426" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        </g>
        <circle class="o" cx="60" cy="54" r="33" fill="#ffdcb8"/>
        <path class="o" d="M27 52 Q26 14 60 14 Q94 14 93 52 Q80 32 60 34 Q40 32 27 52Z" fill="#8a4b2a"/>
        <path class="o" d="M70 16 L84 8 L82 26Z M70 16 L56 8 L58 26Z" fill="#ff7aa8"/>
        <circle cx="48" cy="56" r="4.5" fill="#4a3426"/><circle cx="72" cy="56" r="4.5" fill="#4a3426"/>
        <circle cx="49.5" cy="54.5" r="1.4" fill="#fff"/><circle cx="73.5" cy="54.5" r="1.4" fill="#fff"/>
        <circle cx="40" cy="66" r="6" fill="#ff7a9a" opacity=".55"/><circle cx="80" cy="66" r="6" fill="#ff7a9a" opacity=".55"/>
        <path class="o" d="M48 67 Q60 82 72 67Z" fill="#fff" stroke-width="2.6"/>
      </svg>
      <div class="label">อาหารที่มีประโยชน์</div>
      <div class="items" id="goodItems"></div>
    </div>
    <div class="box" id="bad" data-kind="bad" role="button" aria-label="อาหารที่ไม่มีประโยชน์">
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <path class="o" d="M26 140 L36 92 Q60 82 84 92 L94 140Z" fill="#4fb3ff"/>
        <path d="M36 100 L86 126" fill="none" stroke="#4a3426" stroke-width="17" stroke-linecap="round"/>
        <path d="M84 100 L34 126" fill="none" stroke="#4a3426" stroke-width="17" stroke-linecap="round"/>
        <path d="M36 100 L86 126" fill="none" stroke="#ffdcb8" stroke-width="11" stroke-linecap="round"/>
        <path d="M84 100 L34 126" fill="none" stroke="#ffdcb8" stroke-width="11" stroke-linecap="round"/>
        <circle class="o" cx="60" cy="54" r="33" fill="#ffdcb8"/>
        <path class="o" d="M27 50 Q26 16 60 16 Q94 16 93 50 Q80 34 60 36 Q40 34 27 50Z" fill="#2b2b2b"/>
        <path d="M38 46 L54 53" stroke="#4a3426" stroke-width="4.5" stroke-linecap="round"/><path d="M82 46 L66 53" stroke="#4a3426" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="47" cy="60" r="4.5" fill="#4a3426"/><circle cx="73" cy="60" r="4.5" fill="#4a3426"/>
        <path d="M48 76 Q60 66 72 76" fill="none" stroke="#4a3426" stroke-width="3.4" stroke-linecap="round"/>
        <g stroke="#e53935" stroke-width="8" stroke-linecap="round"><path d="M94 10 L112 28"/><path d="M112 10 L94 28"/></g>
      </svg>
      <div class="label">อาหารที่ไม่มีประโยชน์</div>
      <div class="items" id="badItems"></div>
    </div>
  </div>
</div>

<div class="overlay" id="start">
  <div class="eyebrow">⭐ เกมเลือกอาหาร ⭐</div>
  <div class="logo" id="logoStart"></div>
  <p class="how">ลากรูปอาหารไปวาง หรือแตะช่องที่ถูกต้อง</p>
  <p class="how2">กด 🔊 เพื่อฟังเสียง</p>
  <button class="big" id="startBtn">▶ เริ่มเล่น</button>
</div>
<div class="overlay hidden" id="end">
  <div class="logo small" id="logoEnd"></div>
  <div class="stars" id="endStars"></div>
  <h2 id="endTitle"></h2>
  <p id="endScore"></p>
  <button class="big" id="restartBtn">🔄 เล่นอีกครั้ง</button>
</div>
<div class="overlay hidden" id="gallery" style="justify-content:flex-start">
  <h2>อาหารทั้ง 20 อย่าง</h2>
  <div class="sec">✅ อาหารที่มีประโยชน์</div><div class="gal" id="galGood"></div>
  <div class="sec">⚠️ อาหารที่ไม่มีประโยชน์</div><div class="gal" id="galBad"></div>
</div>

<script>
/* ---------- วาดอาหารการ์ตูน (SVG) ---------- */
const P=(d,f)=>`<path class="o" d="${d}" fill="${f}"/>`;
const C=(x,y,r,f)=>`<circle class="o" cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const R=(x,y,w,h,r,f)=>`<rect class="o" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/>`;
const L=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c||'#4a3426'}" stroke-width="${w||2.5}" stroke-linecap="round"/>`;
const F=(x,y,s,c)=>{c=c||'#4a3426';return `<g transform="translate(${x} ${y}) scale(${s||1})"><circle cx="-9" r="3" fill="${c}"/><circle cx="9" r="3" fill="${c}"/><circle cx="-16" cy="7" r="4" fill="#ff7a9a" opacity=".55"/><circle cx="16" cy="7" r="4" fill="#ff7a9a" opacity=".55"/><path d="M-6 6 Q0 13 6 6" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></g>`};
const ART={

const ITEMS=[

 {id:'pizza',name:'พิซซ่า',kind:'bad',tip:'พิซซ่ามีไขมันและเค็มมาก ควรกินแต่น้อย'}

const $=id=>document.getElementById(id);
const card=$('card');
const DEFAULT_CUE='ลากไปวาง หรือ แตะช่องด้านล่าง (กด 🔊 เพื่อฟัง)';
let speakText='',warnT,resultMode=false,advT,advanceFn=null;
function setCue(t,mode){$('cue').textContent=t;const i=$('info');i.classList.toggle('warn',mode==='warn');i.classList.toggle('ok',mode==='ok')}
let order=[],idx=0,score=0,locked=true,wrongThis=false,audioCtx;

function visual(item,target){
  target.innerHTML=svgOf(item.id);
  const img=new Image();img.alt=item.name;img.draggable=false;
  img.onload=()=>{target.textContent='';target.appendChild(img)};
  img.src='images/'+item.id+'.jpg';
}

/* ---------- เสียง ---------- */
function tone(freqs,dur){dur=dur||.14;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';
  o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+i*dur;
  g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur)})}catch(e){}}
let cancelPrev=null;
function speak(text,cb){
  if(cancelPrev)cancelPrev();
  let done=false,ft;
  const btn=$('say');
  const fin=()=>{if(done)return;done=true;clearTimeout(ft);btn.classList.remove('speaking');if(cb)cb()};
  cancelPrev=()=>{done=true;clearTimeout(ft);btn.classList.remove('speaking')};
  const est=Math.max(1500,text.length*140+500);
  try{
    if(!('speechSynthesis' in window))throw 0;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=.85;u.pitch=1.15;
    const v=speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
    u.onstart=()=>{if(!done)btn.classList.add('speaking')};
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
    ft=setTimeout(fin,est+1500);
  }catch(e){ft=setTimeout(fin,est)}
}
const say=text=>speak(text)
if('speechSynthesis' in window){speechSynthesis.getVoices()}

/* ---------- เกม ---------- */
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function start(){
  order=shuffle(ITEMS);idx=0;score=0;
  $('goodItems').innerHTML='';$('badItems').innerHTML='';
  $('end').classList.add('hidden');$('start').classList.add('hidden');$('gallery').classList.add('hidden');
  showItem();
}
const askText=it=>it.name+' เป็นอาหารที่มีประโยชน์ หรือไม่มีประโยชน์';
function showItem(){
  const it=order[idx];wrongThis=false;
  $('num').textContent=(idx+1)+'/'+ITEMS.length;
  $('score').textContent='⭐ '+score;
  $('name').textContent=it.name;
  visual(it,card);
  card.className='';card.style.transform='';
  clearTimeout(warnT);clearTimeout(advT);resultMode=false;$('nextBtn').classList.add('hidden');setCue(DEFAULT_CUE,false);speakText=askText(it);
  locked=false;
}

function judge(kind){
  if(locked)return;
  const it=order[idx];
  if(kind===it.kind){
    locked=true;
    if(!wrongThis)score++;
    $('score').textContent='⭐ '+score;
    tone([523,659,784]);
    const cheers=['เก่งมาก','ถูกต้อง','เยี่ยมเลย','ยอดเยี่ยม'];
    const cheer=cheers[Math.floor(Math.random()*cheers.length)];
    clearTimeout(warnT);setCue('🎉 '+cheer+' '+it.tip,'ok');
    speakText=cheer+' '+it.tip;resultMode=true;
    const chip=document.createElement('div');chip.className='chip';visual(it,chip);
    card.className='hide';
    setTimeout(()=>{$(kind==='good'?'goodItems':'badItems').appendChild(chip)},250);
    /* ค้างคำอธิบายไว้ รอให้ผู้เล่นกด "ถัดไป" เอง */
    const myIdx=idx;
    advanceFn=()=>{if(idx!==myIdx)return;resultMode=false;$('nextBtn').classList.add('hidden');idx++;if(idx>=ITEMS.length)finish();else showItem()};
    $('nextBtn').textContent=(idx===ITEMS.length-1)?'ดูคะแนน 🏆':'ถัดไป ➡';
    setTimeout(()=>{if(idx===myIdx&&resultMode)$('nextBtn').classList.remove('hidden')},450);
  }else{
    wrongThis=true;
    tone([240,190],.2);
    card.className='back shake';card.style.transform='';
    setTimeout(()=>{card.className=''},500);
    const msg=it.kind==='good'
      ?it.name+'เป็นอาหารที่มีประโยชน์นะ '+it.tip+' ลองใหม่อีกครั้ง'
      :it.name+'เป็นอาหารที่ไม่มีประโยชน์นะ '+it.tip+' ลองใหม่อีกครั้ง';
    clearTimeout(warnT);setCue((it.kind==='good'?'✅ ':'⚠️ ')+it.tip+' ลองใหม่นะ','warn');speakText=msg;
    warnT=setTimeout(()=>{setCue(DEFAULT_CUE,false);speakText=askText(it)},4500);
  }
}
function finish(){
  tone([523,659,784,1047],.2);
  const pct=score/ITEMS.length;
  const full=Math.max(1,Math.round(pct*5));
  $('endStars').textContent='⭐'.repeat(full)+'☆'.repeat(5-full);
  let t,s;
  if(pct===1){t='🏆 เก่งที่สุดเลย!';s='หนูรู้จักอาหารดีๆ ได้ครบทุกอย่าง'}
  else if(pct>=.75){t='🎉 เก่งมาก!';s='หนูเลือกอาหารได้เก่งจัง'}
  else if(pct>=.5){t='😊 ดีมากเลย!';s='ลองเล่นอีกครั้ง จะเก่งขึ้นอีกนะ'}
  else{t='💪 สู้ๆ นะ!';s='ฝึกอีกนิด เดี๋ยวก็เก่งแล้ว'}
  $('endTitle').textContent=t;
  $('endScore').textContent='ได้ '+score+' คะแนน จาก '+ITEMS.length+' ข้อ';
  $('end').classList.remove('hidden');
}

/* ---------- ลากวาง ---------- */
let drag=null;
card.addEventListener('pointerdown',e=>{
  if(locked)return;
  card.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,moved:false};
  card.classList.add('drag');card.classList.remove('back','shake');
});
card.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
  card.style.transform='translate('+dx+'px,'+dy+'px) scale(1.06)';
  const k=boxAt(e.clientX,e.clientY);
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('over',b.dataset.kind===k));
});
function endDrag(e,cancel){
  if(!drag)return;
  const moved=drag.moved;drag=null;
  card.classList.remove('drag');
  document.querySelectorAll('.box').forEach(b=>b.classList.remove('over'));
  const k=cancel?null:boxAt(e.clientX,e.clientY);
  if(k){judge(k)}
  else{card.classList.add('back');card.style.transform='';if(!moved)say(order[idx].name)}
}
card.addEventListener('pointerup',e=>endDrag(e,false));
card.addEventListener('pointercancel',e=>endDrag(e,true));
function boxAt(x,y){
  for(const b of document.querySelectorAll('.box')){
    const r=b.getBoundingClientRect();
    if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6)return b.dataset.kind;
  }
  return null;
}
document.querySelectorAll('.box').forEach(b=>b.addEventListener('click',()=>judge(b.dataset.kind)));
$('nextBtn').onclick=()=>{
  if(!resultMode||!advanceFn)return;
  try{if(cancelPrev)cancelPrev();if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  advanceFn();
};
document.addEventListener('keydown',e=>{
  if(!$('nextBtn').classList.contains('hidden')&&(e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){e.preventDefault();$('nextBtn').click()}
});
$('say').onclick=()=>{
  if(!speakText)return;
  if(resultMode||!locked)say(speakText);
};
$('startBtn').onclick=()=>{tone([660],.08);start()};
$('restartBtn').onclick=start;


/* โลโก้ */

  return `<svg viewBox="0 0 300 190" class="logoSvg" aria-hidden="true">
    <circle class="o" cx="88" cy="95" r="72" fill="#9be37f" style="stroke-width:5"/>
    <circle class="o" cx="212" cy="95" r="72" fill="#ffb870" style="stroke-width:5"/>
    <g transform="translate(40 47) scale(.96)">${ART.apple}</g>
    <g transform="translate(164 47) scale(.96)">${ART.donut}</g>
    ${badge(40,38,'<path d="M-7 0 L-2 6 L8 -6" stroke="#2e9e3e" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>')}
    ${badge(260,38,'<path d="M-6 -6 L6 6M6 -6 L-6 6" stroke="#e53935" stroke-width="4.5" fill="none" stroke-linecap="round"/>')}
  </svg>`;
}
const TITLE_INNER='<div class="pillG">อาหารที่มีประโยชน์</div><div class="divider"><span></span><b>กับ</b><span></span></div><div class="pillB">อาหารที่ไม่มีประโยชน์</div>';
function logoHTML(){
  return logoMark()+'<div class="logoTitle">'+TITLE_INNER+'</div>';
}
$('gameTitle').innerHTML=TITLE_INNER;
$('logoStart').innerHTML=logoHTML();$('logoEnd').innerHTML=logoHTML();
try{
  const fav=document.createElement('link');fav.rel='icon';
  fav.href='data:image/svg+xml,'+encodeURIComponent(logoMark().replace('class="logoSvg"','width="64" height="64"'));
  document.head.appendChild(fav);
}catch(e){}

/* หน้าดูอาหารทั้งหมด: เปิดด้วย #foods */
function gallery(){
  if(location.hash!=='#foods')return;
  for(const k of ['good','bad']){
    const box=$(k==='good'?'galGood':'galBad');box.innerHTML='';
    ITEMS.filter(i=>i.kind===k).forEach(it=>{
      const c=document.createElement('div');c.className='gcell '+(k==='good'?'g':'b');
      c.innerHTML=svgOf(it.id)+'<div>'+it.name+'</div>';box.appendChild(c);
    });
  }
  $('gallery').classList.remove('hidden');
}
window.addEventListener('hashchange',()=>{if(location.hash==='#foods')gallery();else $('gallery').classList.add('hidden')});
gallery();
